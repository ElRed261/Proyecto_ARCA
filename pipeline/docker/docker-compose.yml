services:
  db:
    image: postgres:16-alpine
    container_name: arca-pipeline-db
    environment:
      POSTGRES_USER: arca
      POSTGRES_PASSWORD: arca
      POSTGRES_DB: arca
    ports:
      - "5432:5432"
    volumes:
      - arca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arca -d arca"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arca_pgdata: