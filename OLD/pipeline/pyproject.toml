[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arca-pipeline"
version = "2.1.0"
description = "Batch pipeline: Google Drive .xlsm -> JSON -> validate -> PostgreSQL (bronze/silver/gold)"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "pandera",
    "pandas",
    "sqlalchemy",
    "alembic",
    "prefect>=3",
    "openpyxl",
    "pydantic-settings",
    "psycopg2-binary",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]